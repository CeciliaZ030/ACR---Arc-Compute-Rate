# THIS FILE EXISTS FOR AOMI'S DEPLOY GATE, NOT TO BUILD ANYTHING.
#
# `aomi-build deploy` (and its wizard) check the aomi-sdk pin in the Cargo.toml
# at the REPOSITORY ROOT, never in the App's folder (aomi-sdk 5.1.1,
# bin/build/deploy/cli/deploy.rs → sdk_guard::ensure_project_sdk(git_root)).
# Without this file the deploy stops with "no Cargo.toml found" before it
# reaches Aomi at all. The gate accepts a [workspace.dependencies] pin and a
# missing root Cargo.lock, so that is all this declares.
#
# The App is NOT in this workspace. integrations/aomi/Cargo.toml declares its
# own [workspace] and builds from its own Cargo.lock. `exclude` tells cargo the
# same thing, but Aomi's platform build ignores `exclude`: it walks up from the
# App to the first [workspace] it finds and requires Cargo.lock there. Without
# the App's own table it stopped HERE, where there is no lock, and refused the
# deploy. Its pin and this one must agree; tests in integrations/aomi/src/lib.rs
# fail if they do not, or if the App loses its own [workspace].

[workspace]
resolver = "3"
members  = []
exclude  = ["integrations/aomi"]

[workspace.dependencies]
aomi-sdk = "=5.1.1"
