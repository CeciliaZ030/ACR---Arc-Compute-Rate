[package]
name    = "acr-compute-rate"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
aomi-sdk   = "=5.1.1"
schemars   = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest    = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
